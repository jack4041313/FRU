<!DOCTYPE html>

<html>

<head>

<title>
gNB Monitor
</title>


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Your CSS -->
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}"
>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>


<div class="container">


<h2 class="mt-4">
gNB Monitor Dashboard
</h2>


<div class="card mt-3">

<div class="card-body">

<h5>
gNB Information
</h5>


<p>
IP:
<span id="gnb-ip"></span>
</p>


<p>
Status:

<span id="status" class="badge">
Connected
</span>

</p>


</div>

</div>



<div class="card mt-4">

<div class="card-body">

<h5>
DL Throughput (Mbps)
</h5>


<div class="chart-container">

    <canvas id="throughputChart"></canvas>

</div>


</div>

</div>




<div class="card mt-4">

<div class="card-body">


<h5>
UL BLER (%)
</h5>


<div class="chart-container">

    <canvas id="blerChart"></canvas>

</div>


</div>

</div>



</div>



<script src="/static/js/dashboard.js">
</script>


</body>

</html>
