<!DOCTYPE html>

<html lang="zh-TW">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>gNB Dashboard</title>


<!-- Bootstrap -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<!-- Custom CSS -->

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>


</head>

<body>

<div class="container-fluid p-4">


<!-- =====================================
     Dashboard Title
     ===================================== -->

<h2 class="mb-3" id="dashboardTitle">
    gNB Dashboard
</h2>


<!-- =====================================
     gNB management: aligned two-column layout
     ===================================== -->
<div class="row g-3 mb-4 align-items-start">

    <div class="col-6" style="min-width:0;">
        <label class="form-label fw-bold">Select gNB:</label>
        <div style="overflow-x:auto; width:100%;">
            <div id="gnbButtonGroup" class="d-flex flex-nowrap gap-2 pb-1" style="width:max-content;"
                 role="group" aria-label="Select gNB"></div>
        </div>

    </div>
    <div class="col-6" style="min-width:0;">
        <label class="form-label fw-bold" for="gnbIpInput">Add gNB:</label>
        <form id="addGnbForm" class="d-flex flex-nowrap align-items-center gap-2 mb-0" style="min-width:0;">
            <input id="gnbIpInput" class="form-control" style="width:200px; max-width:65%; min-width:0;" type="text"
                   placeholder="10.255.174.239" autocomplete="off" required>
            <button id="addGnbButton" type="submit" class="btn btn-primary text-nowrap flex-shrink-0">Add gNB</button>
        </form>
        <div id="gnbAddMessage" class="small mt-2" role="status" aria-live="polite"></div>
    </div>

</div>

<!-- =====================================
     Log Windows
     ===================================== -->

<div class="log-grid">


    <!-- =================================
         ORU Controller Boot Log
         ================================= -->

    <div class="log-panel">

        <div class="card">

            <div class="card-header">

                ORU Controller Boot Log

            </div>


            <div class="card-body">

                <div
                    id="rumanagerConsole"
                    class="log-console"
                >
                    Waiting for log...
                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         Netconf Server
         ================================= -->

    <div class="log-panel">

        <div class="card">

            <div class="card-header">

                Netconf Server

            </div>


            <div class="card-body">

                <div
                    id="netconfConsole"
                    class="log-console"
                >
                    Waiting for log...
                </div>

            </div>

        </div>

    </div>


</div>


<!-- =====================================
     RU Configuration / Select RU / Time Range
     Same row: RU Count -> CC per RU -> Save -> Select RU -> Time Range
     ===================================== -->
<div class="d-flex flex-nowrap align-items-end gap-3 mt-3 mb-4"
     style="width:100%; overflow-x:auto; padding-bottom:8px;">

    <div class="flex-shrink-0" style="width:110px;">
        <label for="ruCount" class="form-label">RU Count</label>
        <select id="ruCount" class="form-select">
            <option value="1">1 RU</option>
            <option value="2">2 RU</option>
            <option value="3">3 RU</option>
            <option value="4">4 RU</option>
        </select>
    </div>

    <div class="flex-shrink-0" style="width:120px;">
        <label for="ccPerRu" class="form-label">CC per RU</label>
        <select id="ccPerRu" class="form-select">
            <option value="1">1 CC</option>
            <option value="2">2 CC</option>
            <option value="3">3 CC</option>
        </select>
    </div>

    <div class="flex-shrink-0">
        <button id="saveRuConfig" class="btn btn-primary text-nowrap" type="button">Save Configuration</button>
        <span id="ruConfigMessage" class="small d-none" role="status" aria-live="polite"></span>
    </div>

    <div class="flex-shrink-0">
        <label class="form-label fw-bold">Select RU:</label>
        <div id="ruButtonGroup" class="d-flex flex-nowrap gap-2" style="min-height:38px; align-items:center;"></div>
    </div>

    <div class="flex-shrink-0 ms-auto" style="white-space:nowrap;">
        <div class="mb-0 d-flex flex-nowrap align-items-center gap-2">
            <span>Status:</span>
            <span id="status" class="badge bg-secondary">Checking...</span>
            <span class="ms-2">L1 Up-Time:</span>
            <span id="l1Uptime" class="badge bg-info text-dark">Unknown</span>
        </div>
    </div>

    <div class="flex-shrink-0" style="width:200px;">
        <label for="timeRange" class="form-label">Time Range</label>
        <select id="timeRange" class="form-select">
            <option value="10m">最近 10 分鐘</option>
            <option value="1h">最近 1 小時</option>
            <option value="3h">最近 3 小時</option>
            <option value="6h">最近 6 小時</option>
            <option value="12h">最近 12 小時</option>
            <option value="24h">最近 24 小時</option>
            <option value="3d">最近 3 天</option>
            <option value="7d">最近 7 天</option>
        </select>
    </div>
</div>

<!-- =====================================
     Cell-0 DL
     ===================================== -->

<div class="card mb-4">

    <div class="card-header">

        <span id="cell0DLTitle">Cell-0 DL Throughput</span>

    </div>


    <div class="card-body">

        <div class="chart-container">

            <canvas
                id="cell0DlChart"
            ></canvas>

        </div>

    </div>

</div>


<!-- =====================================
     Cell-0 UL
     ===================================== -->

<div class="card mb-4">

    <div class="card-header">

        <span id="cell0ULTitle">Cell-0 UL Throughput</span>

    </div>


    <div class="card-body">

        <div class="chart-container">

            <canvas
                id="cell0UlChart"
            ></canvas>

        </div>

    </div>

</div>


<!-- =====================================
     Cell-1 DL
     ===================================== -->

<div id="cc1Card" class="card mb-4">

    <div class="card-header">

        <span id="cell1DLTitle">Cell-1 DL Throughput</span>

    </div>


    <div class="card-body">

        <div class="chart-container">

            <canvas
                id="cell1DlChart"
            ></canvas>

        </div>

    </div>

</div>


<!-- =====================================
  Cell 2 DL
 ===================================== -->

<div id="cc2Card" class="card mb-4">

    <div class="card-header">

        <span id="cell2DLTitle">Cell-2 DL Throughput</span>

    </div>


    <div class="card-body">

        <div class="chart-container">

            <canvas
                id="cell2DlChart"
            ></canvas>

        </div>

    </div>

</div>


<!-- =====================================
     Chart.js
     ===================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js"
></script>


<!-- =====================================
     Dashboard JS
     ===================================== -->

<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>

</body>

</html>
