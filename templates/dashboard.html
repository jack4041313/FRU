<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        gNB Monitor Dashboard
    </title>


    <!-- =====================================
         Bootstrap
         ===================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================
         Custom CSS
         ===================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<div class="container-fluid p-4">


    <!-- =====================================
         Dashboard Title
         ===================================== -->

    <h2 class="mb-3">
        gNB Monitor Dashboard
    </h2>


    <!-- =====================================
         L1 Up-Time
         ===================================== -->

    <div class="mb-3">

        <span>
            L1 Up-Time:
        </span>


        <span
            id="uptime"
            class="badge bg-success"
        >
            Waiting...
        </span>

    </div>


    <!-- =====================================
         Log Windows
         ===================================== -->

    <div class="log-grid">


        <!-- =================================
             Netconf Server
             ================================= -->

        <div class="log-panel">

            <div class="card">

                <div class="card-header">

                    Netconf Server

                </div>


                <div class="card-body">

                    <div
                        id="netconfConsole"
                        class="log-console"
                    >
                        Waiting for log...
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================
             RU Manager
             ================================= -->

        <div class="log-panel">

            <div class="card">

                <div class="card-header">

                    RU Manager

                </div>


                <div class="card-body">

                    <div
                        id="rumanagerConsole"
                        class="log-console"
                    >
                        Waiting for log...
                    </div>

                </div>

            </div>

        </div>


    </div>


    <!-- =====================================
         Time Range
         ===================================== -->

    <div class="mt-4 mb-4">

        <select
            id="timeRange"
            class="form-select"
            style="width:200px;"
        >

            <option value="10m">
                最近 10 分鐘
            </option>

            <option value="1h">
                最近 1 小時
            </option>

            <option value="3h">
                最近 3 小時
            </option>

            <option value="6h">
                最近 6 小時
            </option>

            <option value="12h">
                最近 12 小時
            </option>

            <option value="24h">
                最近 24 小時
            </option>

            <option value="3d">
                最近 3 天
            </option>

            <option value="7d">
                最近 7 天
            </option>

        </select>

    </div>


    <!-- =====================================
         Cell-0 DL
         ===================================== -->

    <div class="card mb-4">

        <div class="card-header">

            Cell-0 DL Throughput

        </div>


        <div class="card-body">

            <div class="chart-container">

                <canvas
                    id="cell0DlChart"
                ></canvas>

            </div>

        </div>

    </div>


    <!-- =====================================
         Cell-0 UL
         ===================================== -->

    <div class="card mb-4">

        <div class="card-header">

            Cell-0 UL Throughput

        </div>


        <div class="card-body">

            <div class="chart-container">

                <canvas
                    id="cell0UlChart"
                ></canvas>

            </div>

        </div>

    </div>


    <!-- =====================================
         Cell-1 DL
         ===================================== -->

    <div class="card mb-4">

        <div class="card-header">

            Cell-1 DL Throughput

        </div>


        <div class="card-body">

            <div class="chart-container">

                <canvas
                    id="cell1DlChart"
                ></canvas>

            </div>

        </div>

    </div>


    <!-- =====================================
         Cell-1 UL
         ===================================== -->

    <div class="card mb-4">

        <div class="card-header">

            Cell-1 UL Throughput

        </div>


        <div class="card-body">

            <div class="chart-container">

                <canvas
                    id="cell1UlChart"
                ></canvas>

            </div>

        </div>

    </div>


</div>


<!-- =====================================
     Chart.js
     ===================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js"
></script>


<!-- =====================================
     Dashboard JavaScript
     ===================================== -->

<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>


</body>

</html>
