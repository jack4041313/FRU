<!-- =====================================
     gNB Selection JS
     新增：選擇 gNB 並更新標題
     ===================================== -->

<script>

    // 目前選取的 gNB IP
    let selectedGNBIP = "10.255.174.7";

    function selectGNB(ip) {

        selectedGNBIP = ip;

        // 更新 Dashboard 標題
        document.getElementById("dashboardTitle").textContent =
            ip + " Dashboard";

        // 更新瀏覽器頁籤標題
        document.title = ip + " Dashboard";

        // 更新按鈕外觀
        document.querySelectorAll("[data-gnb-ip]").forEach(button => {

            const selected = button.dataset.gnbIp === ip;

            button.classList.toggle("btn-primary", selected);
            button.classList.toggle("active", selected);
            button.classList.toggle("btn-outline-primary", !selected);

            button.setAttribute(
                "aria-pressed",
                selected ? "true" : "false"
            );

        });

        // 通知 dashboard.js 切換 gNB。
        // dashboard.js 尚未實作此事件前，這只會更新按鈕與標題。
        window.dispatchEvent(
            new CustomEvent("gnbChanged", {
                detail: {
                    ip: selectedGNBIP
                }
            })
        );

        console.log("[Dashboard] Selected gNB:", selectedGNBIP);
    }

</script>


<!-- =====================================
     Dashboard JS
     ===================================== -->

<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>
